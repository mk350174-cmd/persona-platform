repos:
  # YAML formatting
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-ast

  # Python formatting with Black
  - repo: https://github.com/psf/black
    rev: 23.3.0
    hooks:
      - id: black
        language_version: python3

  # Python linting with flake8
  - repo: https://github.com/PyCQA/flake8
    rev: 6.0.0
    hooks:
      - id: flake8
        args: ['--max-line-length=120', '--extend-ignore=E203,W503,E501']

  # Python linting with ruff
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.0.272
    hooks:
      - id: ruff
        args: ['--fix']

  # Security check
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.5
    hooks:
      - id: bandit
        args: ['-ll', '-i']  # Low level issues, ignore non-bandit checks

  # Detect secrets
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets

  # No TODO/FIXME in production code
  - repo: local
    hooks:
      - id: no-placeholder-code
        name: Reject placeholder code in production
        entry: bash -c 'grep -r TODO api/ --include="*.py" && exit 1 || exit 0'
        language: system
        files: ^api/.*\.py$
        pass_filenames: false
        stages: [commit]

      # No test fixtures outside conftest
      - id: no-test-fixtures-outside-conftest
        name: Pytest fixtures must be in conftest.py
        entry: bash -c 'grep -r @pytest.fixture tests/ --include="*.py" --exclude="conftest.py" && exit 1 || exit 0'
        language: system
        files: ^tests/test_.*\.py$
        pass_filenames: false
        stages: [commit]
