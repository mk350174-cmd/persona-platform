version: "3.9"

# ────────────────────────────────────────────────────────────────────────────
# Persona Platform — Staging Environment
# ────────────────────────────────────────────────────────────────────────────
#
# This compose file deploys a complete staging environment with reduced
# resource allocation suitable for integration testing and pre-production
# validation. All services include health checks and persistent volumes.
#
# Usage:
#   docker-compose -f docker-compose.staging.yml up -d
#   docker-compose -f docker-compose.staging.yml down
#   docker-compose -f docker-compose.staging.yml logs -f api
#
# ────────────────────────────────────────────────────────────────────────────

services:

  # ── API Application ───────────────────────────────────────────────────────
  # Main FastAPI application serving personas and platform endpoints
  api:
    build: .
    container_name: persona-api-staging
    expose:
      - "8000"
    ports:
      - "8000:8000"
    env_file:
      - .env.staging
    volumes:
      # Persistent database (SQLite for staging)
      - staging_persona_db:/app/data
      # Temporary audio files
      - staging_audio:/tmp/persona_audio
      # Logs for debugging
      - staging_api_logs:/app/logs
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - staging
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      # Staging: reduced resources (vs 2 CPU, 1GB prod)
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── PostgreSQL Database ────────────────────────────────────────────────────
  # Staging PostgreSQL instance with persistent storage
  postgres:
    image: postgres:16-alpine
    container_name: persona-postgres-staging
    environment:
      POSTGRES_DB: persona_hub_staging
      POSTGRES_USER: ${POSTGRES_USER:-staging_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-staging_password_change_me}
      # Enable query logging for debugging slow queries in staging
      POSTGRES_INITDB_ARGS: "-c log_statement=all -c log_duration=on"
    volumes:
      # Persistent database volume
      - staging_postgres_data:/var/lib/postgresql/data
      # Optional: init scripts for seed data
      - ./scripts/staging/seed-data.sql:/docker-entrypoint-initdb.d/01-seed.sql:ro
    ports:
      - "5433:5432"  # Non-standard port to avoid collision with prod
    networks:
      - staging
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-staging_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 384M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Redis Cache ────────────────────────────────────────────────────────────
  # In-memory cache for sessions, API rate limiting, and caching
  redis:
    image: redis:7-alpine
    container_name: persona-redis-staging
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --loglevel notice
      --logfile /var/log/redis.log
    volumes:
      - staging_redis_data:/data
      - staging_redis_logs:/var/log
    ports:
      - "6380:6379"  # Non-standard port to avoid collision with prod
    networks:
      - staging
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  # ── Nginx Reverse Proxy ────────────────────────────────────────────────────
  # HTTP/HTTPS gateway with SSL termination and request routing
  nginx:
    image: nginx:1.27-alpine
    container_name: persona-nginx-staging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Use staging-specific nginx config
      - ./nginx/staging.conf:/etc/nginx/conf.d/default.conf:ro
      # Optional: self-signed certificate for HTTPS in staging
      - ./certs/staging:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - staging
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          memory: 32M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  # ── Backup Service (Lightweight) ───────────────────────────────────────────
  # Periodic database backups for staging data recovery
  backup:
    image: postgres:16-alpine
    container_name: persona-backup-staging
    volumes:
      # Backup scripts
      - ./scripts/backup:/backup:ro
      # Backup storage (local only in staging)
      - staging_backups:/backups
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-staging_user}:${POSTGRES_PASSWORD:-staging_password_change_me}@postgres:5432/persona_hub_staging
      BACKUP_DIR: /backups
      # S3 disabled in staging to avoid costs
      BACKUP_S3_BUCKET: ""
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - staging
    entrypoint: |
      /bin/sh -c "
      apk add --no-cache bash curl
      echo 'Backup container started - runs daily at 2 AM'
      (crontab -l 2>/dev/null || true; echo '0 2 * * * /backup/pg_backup.sh') | crontab -
      exec crond -f -l 0
      "
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          memory: 32M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ── Adminer (Optional: Database Admin UI) ──────────────────────────────────
  # Web-based PostgreSQL administration tool (remove for production)
  adminer:
    image: adminer:latest
    container_name: persona-adminer-staging
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - staging
    restart: unless-stopped
    environment:
      ADMINER_PLUGINS: tables-filter tinymce
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ── Prometheus Metrics (Optional: Monitoring) ──────────────────────────────
  # Time-series database for collecting metrics from all services
  prometheus:
    image: prom/prometheus:latest
    container_name: persona-prometheus-staging
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"  # Keep 7 days of metrics
    volumes:
      - ./monitoring/prometheus-staging.yml:/etc/prometheus/prometheus.yml:ro
      - staging_prometheus_data:/prometheus
    ports:
      - "9091:9090"
    networks:
      - staging
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ── Grafana Dashboards (Optional: Visualization) ───────────────────────────
  # Metrics visualization and alerting dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: persona-grafana-staging
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3001
    volumes:
      # Grafana provisioning
      - ./monitoring/grafana-staging/provisioning:/etc/grafana/provisioning:ro
      # Persistent data
      - staging_grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    networks:
      - staging
    depends_on:
      - prometheus
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          memory: 32M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

# ────────────────────────────────────────────────────────────────────────────
# Networks
# ────────────────────────────────────────────────────────────────────────────
networks:
  staging:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16

# ────────────────────────────────────────────────────────────────────────────
# Volumes
# ────────────────────────────────────────────────────────────────────────────
# All data is persisted locally. No external cloud storage is used in staging
# to avoid unnecessary costs and keep environments isolated.

volumes:
  staging_persona_db:
    driver: local
  staging_postgres_data:
    driver: local
  staging_redis_data:
    driver: local
  staging_audio:
    driver: local
  staging_api_logs:
    driver: local
  staging_redis_logs:
    driver: local
  staging_backups:
    driver: local
  staging_prometheus_data:
    driver: local
  staging_grafana_data:
    driver: local
