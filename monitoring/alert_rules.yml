# Prometheus Alert Rules for Persona Platform Load Testing
# These rules detect performance issues during load tests

groups:
  - name: persona-load-test
    interval: 30s
    rules:
      # ── Response Time Alerts ────────────────────────────────────────────

      - alert: HighP95ResponseTime
        expr: |
          http_request_duration_seconds{quantile="0.95"} > 0.5
        for: 2m
        labels:
          severity: warning
          component: api
        annotations:
          summary: "High p95 response time detected"
          description: "p95 response time is {{ $value | humanizeDuration }} (threshold: 500ms)"

      - alert: HighP99ResponseTime
        expr: |
          http_request_duration_seconds{quantile="0.99"} > 1.0
        for: 2m
        labels:
          severity: warning
          component: api
        annotations:
          summary: "High p99 response time detected"
          description: "p99 response time is {{ $value | humanizeDuration }} (threshold: 1s)"

      # ── Error Rate Alerts ──────────────────────────────────────────────

      - alert: HighErrorRate
        expr: |
          (
            rate(http_requests_total{status=~"5.."}[5m]) /
            rate(http_requests_total[5m])
          ) > 0.02
        for: 2m
        labels:
          severity: critical
          component: api
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }} (threshold: 2%)"

      - alert: ServiceUnavailable
        expr: |
          rate(http_requests_total{status="503"}[1m]) > 0
        for: 1m
        labels:
          severity: critical
          component: api
        annotations:
          summary: "Service unavailable (503) errors detected"
          description: "Service returned {{ $value | humanize }} 503 errors/sec"

      # ── Resource Utilization Alerts ────────────────────────────────────

      - alert: HighCPUUsage
        expr: |
          (
            100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)
          ) > 80
        for: 3m
        labels:
          severity: warning
          component: infrastructure
        annotations:
          summary: "High CPU usage detected"
          description: "CPU usage is {{ $value | humanize }}% on {{ $labels.instance }}"

      - alert: HighMemoryUsage
        expr: |
          (
            1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)
          ) > 0.85
        for: 3m
        labels:
          severity: warning
          component: infrastructure
        annotations:
          summary: "High memory usage detected"
          description: "Memory usage is {{ $value | humanizePercentage }} on {{ $labels.instance }}"

      # ── Database Alerts ────────────────────────────────────────────────

      - alert: DatabaseConnectionPoolExhausted
        expr: |
          pg_stat_activity_count > 40
        for: 2m
        labels:
          severity: critical
          component: database
        annotations:
          summary: "Database connection pool nearly exhausted"
          description: "{{ $value | humanize }} connections in use (limit: 50)"

      - alert: DatabaseSlowQueries
        expr: |
          rate(pg_slow_queries[5m]) > 10
        for: 2m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "High rate of slow queries detected"
          description: "{{ $value | humanize }} slow queries/sec"

      - alert: DatabaseReplicationLag
        expr: |
          pg_replication_lag_seconds > 5
        for: 1m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "Database replication lag detected"
          description: "Replication lag is {{ $value | humanizeDuration }}"

      # ── Cache Alerts ───────────────────────────────────────────────────

      - alert: RedisHighMemory
        expr: |
          (redis_memory_used_bytes / redis_memory_max_bytes) > 0.9
        for: 2m
        labels:
          severity: warning
          component: cache
        annotations:
          summary: "Redis memory usage is high"
          description: "Redis memory is {{ $value | humanizePercentage }} of limit"

      - alert: RedisEvictions
        expr: |
          rate(redis_evicted_keys_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
          component: cache
        annotations:
          summary: "Redis is evicting keys"
          description: "{{ $value | humanize }} evictions/sec"

      # ── Load Test Execution Alerts ─────────────────────────────────────

      - alert: LoadTestLowerThroughput
        expr: |
          rate(http_requests_total[5m]) < 5
        for: 5m
        labels:
          severity: warning
          component: load-test
        annotations:
          summary: "Load test throughput is lower than expected"
          description: "Throughput is {{ $value | humanize }} req/sec (expected: 5+ req/sec)"

      - alert: LoadTestHighLatency
        expr: |
          http_request_duration_seconds{quantile="0.5"} > 0.3
        for: 3m
        labels:
          severity: warning
          component: load-test
        annotations:
          summary: "Load test showing higher than expected latency"
          description: "Median latency is {{ $value | humanizeDuration }} (expected: <300ms)"

      # ── Locust Worker Alerts ───────────────────────────────────────────

      - alert: LocustWorkerDown
        expr: |
          up{job="locust-worker"} == 0
        for: 1m
        labels:
          severity: critical
          component: load-test
        annotations:
          summary: "Locust worker is down"
          description: "Worker {{ $labels.instance }} is not responding"

      - alert: LocustHighFailureRate
        expr: |
          (
            rate(locust_requests_failed_total[5m]) /
            (rate(locust_requests_failed_total[5m]) + rate(locust_requests_success_total[5m]))
          ) > 0.05
        for: 2m
        labels:
          severity: warning
          component: load-test
        annotations:
          summary: "Locust reporting high failure rate"
          description: "Failure rate is {{ $value | humanizePercentage }} (threshold: 5%)"

      # ── API Container Alerts ───────────────────────────────────────────

      - alert: APIContainerRestarting
        expr: |
          rate(container_last_seen{name="persona-api"}[5m]) > 1
        labels:
          severity: critical
          component: api
        annotations:
          summary: "API container is restarting frequently"
          description: "Container {{ $labels.name }} has restarted {{ $value | humanize }} times"

      - alert: APIContainerCrashed
        expr: |
          container_state_status{name="persona-api",state="exited"} == 1
        labels:
          severity: critical
          component: api
        annotations:
          summary: "API container has crashed"
          description: "Container {{ $labels.name }} is not running"
