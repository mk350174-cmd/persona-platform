# Prometheus configuration for Persona Platform load testing
# Scrapes metrics from API server and infrastructure components

global:
  scrape_interval: 15s        # Default scrape interval
  evaluation_interval: 15s    # Default evaluation interval
  external_labels:
    monitor: 'persona-load-test'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Load rules once and periodically evaluate them
rule_files:
  - "alert_rules.yml"

# Scrape configurations
scrape_configs:
  # ── Prometheus self-monitoring ──────────────────────────────────────────

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ── API Server Metrics ──────────────────────────────────────────────────

  - job_name: 'persona-api'
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s
    static_configs:
      - targets: ['api:8000']
        labels:
          service: 'persona-api'
          environment: 'load-test'

  # ── PostgreSQL Metrics ──────────────────────────────────────────────────

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']
        labels:
          service: 'postgres'
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'pg_.*'
        action: keep

  # ── Redis Metrics ──────────────────────────────────────────────────────

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
        labels:
          service: 'redis'

  # ── Container Metrics (cAdvisor) ────────────────────────────────────────

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'container_.*'
        action: keep

  # ── Locust Master Metrics ──────────────────────────────────────────────

  - job_name: 'locust-master'
    metrics_path: '/stats/requests/csv'
    scrape_interval: 5s
    static_configs:
      - targets: ['locust-master:8089']
        labels:
          service: 'locust'
          role: 'master'

  # ── Node Exporter (if available) ────────────────────────────────────────

  - job_name: 'node'
    static_configs:
      - targets: ['localhost:9100']
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'node_.*'
        action: keep
