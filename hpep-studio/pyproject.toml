[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "hpep"
version = "1.0.0"
description = "HPEP Studio Python SDK — matematiksel AI persona mühendisliği"
readme = "sdk/README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["ai", "persona", "hpep", "ceid", "llm"]
dependencies = ["httpx>=0.27.0"]

[project.urls]
Homepage = "https://hpep.studio"
Documentation = "https://docs.hpep.studio"
Repository = "https://github.com/mk350174-cmd/hpep-studio"

[tool.setuptools.packages.find]
where = ["sdk"]
