[pytest]
# Pytest configuration for Persona Platform integration tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Paths to search for tests
testpaths = tests

# Minimum Python version
minversion = 7.0

# Markers for organizing tests
markers =
    slow: marks tests as slow (load tests, sustained tests) — deselect with '-m "not slow"'
    integration: marks tests as integration tests (all tests by default)
    websocket: marks tests as WebSocket-specific tests
    load: marks tests as load/stress tests
    health: marks tests as health/connectivity checks
    auth: marks tests as authentication tests
    persona: marks tests as persona API tests
    purchase: marks tests as purchase/billing tests
    analytics: marks tests as admin analytics tests
    error: marks tests as error handling tests

# Test output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Coverage options (when using pytest-cov)
# Uncomment to enable:
# --cov=api
# --cov=persona_math
# --cov-report=term-missing
# --cov-report=html

# Asyncio mode for pytest-asyncio
asyncio_mode = auto

# Test timeout (requires pytest-timeout)
# timeout = 300
