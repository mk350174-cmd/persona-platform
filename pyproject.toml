[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "persona-platform"
version = "0.1.0"
description = "Persona knowledge graph + MCP platform (web/app layer rebuilt separately)"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
packages = ["needle", "persona_math", "persona_mcp"]

[tool.setuptools.package-data]
"*" = ["*.py", "*.json", "*.yaml", "*.yml"]
