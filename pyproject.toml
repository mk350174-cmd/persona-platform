[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "persona-platform"
version = "0.1.0"
description = "Production REST API and MCP platform for Persona knowledge graphs"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
packages = ["api", "needle", "persona_math", "persona_mcp", "tests"]

[tool.setuptools.package-data]
"*" = ["*.py", "*.json", "*.yaml", "*.yml"]
