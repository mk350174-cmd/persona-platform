name: Backup Health Check

# Run weekly on Sunday at 10:00 UTC
on:
  schedule:
    - cron: '0 10 * * 0'
  # Allow manual trigger
  workflow_dispatch:

jobs:
  backup-health:
    runs-on: ubuntu-latest
    name: Verify Backup Health & Integrity

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check backup existence
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
        run: |
          if [ -z "$BACKUP_S3_BUCKET" ]; then
            echo "⚠️  BACKUP_S3_BUCKET not configured, skipping S3 checks"
            exit 0
          fi

          echo "Checking latest backup in S3..."
          LATEST_BACKUP=$(aws s3 ls "s3://${BACKUP_S3_BUCKET}/" --recursive \
            | grep "persona_backup_.*\.sql\.gz" \
            | sort | tail -1 | awk '{print $NF}')

          if [ -z "$LATEST_BACKUP" ]; then
            echo "❌ ERROR: No backups found in S3 bucket: $BACKUP_S3_BUCKET"
            exit 1
          fi

          echo "✅ Latest backup found: $LATEST_BACKUP"

          # Check backup age
          BACKUP_DATE=$(echo "$LATEST_BACKUP" | sed 's/.*persona_backup_//' | sed 's/.sql.gz//')
          echo "Backup timestamp: $BACKUP_DATE"

          # Calculate age in hours
          BACKUP_EPOCH=$(date -d "$BACKUP_DATE" +%s 2>/dev/null || echo 0)
          CURRENT_EPOCH=$(date +%s)
          AGE_HOURS=$(( (CURRENT_EPOCH - BACKUP_EPOCH) / 3600 ))

          echo "Backup age: ${AGE_HOURS} hours"

          if [ $AGE_HOURS -gt 24 ]; then
            echo "❌ ERROR: Backup is older than 24 hours (stale)"
            exit 1
          fi

          echo "✅ Backup age check passed"

      - name: Validate backup integrity
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
        run: |
          if [ -z "$BACKUP_S3_BUCKET" ]; then
            echo "⚠️  Skipping backup integrity check (S3 not configured)"
            exit 0
          fi

          echo "Downloading latest backup for validation..."
          LATEST_BACKUP=$(aws s3 ls "s3://${BACKUP_S3_BUCKET}/" --recursive \
            | grep "persona_backup_.*\.sql\.gz" \
            | sort | tail -1 | awk '{print $NF}')

          if [ -z "$LATEST_BACKUP" ]; then
            echo "❌ ERROR: No backups found for validation"
            exit 1
          fi

          # Download backup
          aws s3 cp "s3://${BACKUP_S3_BUCKET}/${LATEST_BACKUP}" "/tmp/backup_validate.sql.gz" --no-progress

          # Check gzip integrity
          echo "Checking gzip integrity..."
          if ! gzip -t /tmp/backup_validate.sql.gz; then
            echo "❌ ERROR: Backup file is corrupted (gzip check failed)"
            rm /tmp/backup_validate.sql.gz
            exit 1
          fi

          echo "✅ Gzip integrity check passed"

          # Check file size
          SIZE=$(stat --format=%s /tmp/backup_validate.sql.gz 2>/dev/null || stat -f%z /tmp/backup_validate.sql.gz)
          SIZE_MB=$((SIZE / 1024 / 1024))
          echo "Backup size: ${SIZE_MB}MB"

          if [ $SIZE_MB -lt 1 ]; then
            echo "❌ ERROR: Backup file is suspiciously small (< 1MB)"
            rm /tmp/backup_validate.sql.gz
            exit 1
          fi

          echo "✅ File size check passed"

          # Sample SQL syntax check
          echo "Sampling backup for SQL validity..."
          if gunzip -c /tmp/backup_validate.sql.gz | head -1000 | grep -q "^CREATE\|^INSERT\|^DROP"; then
            echo "✅ SQL syntax check passed"
          else
            echo "⚠️  Could not verify SQL syntax (may be valid)"
          fi

          rm /tmp/backup_validate.sql.gz

      - name: Send Slack notification (success)
        if: success()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "✅ Backup health check passed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*✅ Backup Health Check Passed*\n*Repo:* ${{ github.repository }}\n*Time:* <!date^${{ env.GITHUB_ACTION_RUN_ID }}^{date_pretty}|${{ env.GITHUB_ACTION_RUN_ID }}>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
        continue-on-error: true

      - name: Send Slack notification (failure)
        if: failure()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "❌ Backup health check FAILED",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*❌ BACKUP HEALTH CHECK FAILED*\n*Repo:* ${{ github.repository }}\n*Action:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
        continue-on-error: true

      - name: Create GitHub Issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🔴 Backup Health Check Failed',
              body: `Automated backup health check failed on ${{ github.run_id }}\n\nAction: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}>\n\nPlease investigate immediately.`,
              labels: ['backup', 'critical', 'operations']
            })
        continue-on-error: true
