name: Database Backup

on:
  schedule:
    # Daily at 02:00 UTC
    - cron: '0 2 * * *'
  # Allow manual trigger with optional parameters
  workflow_dispatch:
    inputs:
      db_url:
        description: 'Override DATABASE_URL (leave blank to use secret)'
        required: false
        default: ''
      keep_days:
        description: 'Retention policy — delete backups older than N days'
        required: false
        default: '30'
      dry_run:
        description: 'Dry run (validate only, do not upload)'
        type: boolean
        required: false
        default: false

env:
  PYTHON_VERSION: '3.11'
  BACKUP_DIR: /tmp/persona_backups
  DEFAULT_KEEP_DAYS: 30

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Job 1: Run database backup
  # ──────────────────────────────────────────────────────────────────────────
  backup:
    name: Backup Database
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # Install only the packages backup.py needs
          pip install boto3 botocore 2>/dev/null || true
          # Install project dependencies if requirements.txt exists
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          elif [ -f requirements/base.txt ]; then
            pip install -r requirements/base.txt
          fi

      - name: Create backup output directory
        run: mkdir -p "${{ env.BACKUP_DIR }}"

      - name: Resolve database URL
        id: db_url
        run: |
          # Prefer manual workflow input, fall back to repository secret, then SQLite dev default
          if [ -n "${{ github.event.inputs.db_url }}" ]; then
            echo "url=${{ github.event.inputs.db_url }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ secrets.DATABASE_URL }}" ]; then
            echo "url=${{ secrets.DATABASE_URL }}" >> "$GITHUB_OUTPUT"
          else
            echo "url=sqlite:///./persona_store.db" >> "$GITHUB_OUTPUT"
            echo "WARNING: Using SQLite dev database — set DATABASE_URL secret for production."
          fi

      - name: Resolve retention policy
        id: keep_days
        run: |
          INPUT="${{ github.event.inputs.keep_days }}"
          echo "days=${INPUT:-${{ env.DEFAULT_KEEP_DAYS }}}" >> "$GITHUB_OUTPUT"

      - name: Run database backup
        id: run_backup
        env:
          DATABASE_URL: ${{ steps.db_url.outputs.url }}
          S3_BACKUP_BUCKET: ${{ secrets.S3_BACKUP_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}
          BACKUP_DIR: ${{ env.BACKUP_DIR }}
          BACKUP_RETENTION_DAYS: ${{ steps.keep_days.outputs.days }}
          LOG_FILE: /tmp/persona_backup.log
        run: |
          echo "=== Starting Persona Platform Backup ==="
          echo "Timestamp  : $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "Keep days  : ${{ steps.keep_days.outputs.days }}"
          echo "Output dir : ${{ env.BACKUP_DIR }}"

          python scripts/backup.py \
            --output "${{ env.BACKUP_DIR }}" \
            --db-url "$DATABASE_URL" \
            --keep-days "$BACKUP_RETENTION_DAYS" \
            --verbose

          echo "=== Backup Script Completed ==="

      - name: List produced backups
        if: success()
        run: |
          python scripts/backup.py \
            --list \
            --output "${{ env.BACKUP_DIR }}"

      - name: Upload backup as GitHub Actions artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: persona-db-backup-${{ github.run_id }}
          path: ${{ env.BACKUP_DIR }}/*.gz
          retention-days: 7
          if-no-files-found: warn

      - name: Upload backup log as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: persona-backup-log-${{ github.run_id }}
          path: /tmp/persona_backup.log
          retention-days: 30
          if-no-files-found: ignore

      - name: Notify on failure — workflow log
        if: failure()
        run: |
          echo "::error title=Backup Failed::The database backup job failed."
          echo "::error::Run ID: ${{ github.run_id }}"
          echo "::error::Triggered by: ${{ github.event_name }}"
          echo "::error::Ref: ${{ github.ref }}"
          echo ""
          echo "ACTION REQUIRED: Investigate the backup failure immediately."
          echo "Review the logs at:"
          echo "  ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # ──────────────────────────────────────────────────────────────────────────
  # Job 2: Post-backup health check
  # Runs after a successful backup to verify the DB is healthy.
  # ──────────────────────────────────────────────────────────────────────────
  healthcheck:
    name: Post-Backup Health Check
    runs-on: ubuntu-latest
    needs: backup
    timeout-minutes: 10
    # Only run health check when there is a real database to connect to.
    # Skip for pure SQLite-only runs where the DB file isn't on the runner.
    if: |
      needs.backup.result == 'success' &&
      (startsWith(secrets.DATABASE_URL, 'postgresql') ||
       startsWith(secrets.DATABASE_URL, 'postgres'))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          elif [ -f requirements/base.txt ]; then
            pip install -r requirements/base.txt
          fi

      - name: Run database health check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "=== Running Post-Backup Health Check ==="
          python scripts/healthcheck.py \
            --db-url "$DATABASE_URL" \
            --json \
            --verbose
          HEALTH_EXIT=$?

          if [ $HEALTH_EXIT -eq 0 ]; then
            echo "Health check: HEALTHY"
          elif [ $HEALTH_EXIT -eq 1 ]; then
            echo "::warning title=DB Degraded::Post-backup health check reports DEGRADED status."
          else
            echo "::error title=DB Down::Post-backup health check reports DB is DOWN."
            exit 1
          fi

  # ──────────────────────────────────────────────────────────────────────────
  # Job 3: Notify on overall workflow failure
  # ──────────────────────────────────────────────────────────────────────────
  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [backup, healthcheck]
    if: failure()
    timeout-minutes: 5

    steps:
      - name: Log failure to workflow
        run: |
          echo "::error title=Backup Workflow Failed::One or more backup/healthcheck jobs failed."
          cat <<'EOF'
          =====================================================
          PERSONA PLATFORM BACKUP WORKFLOW FAILURE
          =====================================================
          Run ID    : ${{ github.run_id }}
          Triggered : ${{ github.event_name }}
          Time      : $(date -u)

          IMMEDIATE ACTION REQUIRED:
            1. Review logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            2. Verify database accessibility
            3. Check S3 bucket permissions (if configured)
            4. Contact on-call engineer if issue persists

          Refer to BACKUP_DR.md for the incident response procedure.
          =====================================================
          EOF

      - name: Create GitHub Issue on failure
        uses: actions/github-script@v7
        with:
          script: |
            const now = new Date().toISOString();
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const jobs = {
              backup: '${{ needs.backup.result }}',
              healthcheck: '${{ needs.healthcheck.result }}'
            };
            const failedJobs = Object.entries(jobs)
              .filter(([, result]) => result === 'failure')
              .map(([name]) => name)
              .join(', ');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[BACKUP FAILURE] Automated backup failed — ${now.slice(0,10)}`,
              body: [
                '## Automated Backup Failure',
                '',
                `**Run:** [${context.runId}](${runUrl})`,
                `**Time:** ${now}`,
                `**Trigger:** ${context.eventName}`,
                `**Failed jobs:** ${failedJobs}`,
                '',
                '## Required Actions',
                '',
                '- [ ] Review the failed run logs',
                '- [ ] Verify database is accessible',
                '- [ ] Check S3 bucket permissions (if configured)',
                '- [ ] Run backup manually once the issue is resolved',
                '- [ ] Close this issue once resolved',
                '',
                '## References',
                '',
                '- [Run Logs](' + runUrl + ')',
                '- [Disaster Recovery Playbook](BACKUP_DR.md)',
              ].join('\n'),
              labels: ['backup', 'critical', 'operations'],
            });
        continue-on-error: true
