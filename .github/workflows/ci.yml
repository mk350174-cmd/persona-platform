name: CI

on:
  push:
    branches: [main, "claude/*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Lint (ruff)
        run: |
          pip install ruff
          # E711/E712: SQLAlchemy filters require `== None` / `== True` (compile to
          # IS NULL / IS TRUE); `is`-comparisons would break query generation.
          ruff check persona_math/ api/ --select E,F,W --ignore E501,E711,E712

      - name: Run tests (parallel)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || 'sk-test' }}
          STRIPE_SECRET_KEY: sk_test_dummy
          ELEVENLABS_API_KEY: el_test_dummy
        run: |
          pytest tests/ -n auto --dist loadscope -v --tb=short
