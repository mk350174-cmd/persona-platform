name: CI

on:
  push:
    branches: [main, "claude/*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check persona_math/ needle/ persona_mcp/ --select E,F,W --ignore E501,E711,E712

      - name: Run tests (parallel)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || 'sk-test' }}
        run: |
          pytest needle/training/tests persona_mcp/tests -n auto --dist loadscope -v --tb=short
