name: CI - Multi-Python Matrix Tests (H87)

on:
  push:
    branches: [main, develop, "claude/*"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION_DEFAULT: "3.11"
  DATABASE_URL: "sqlite:///:memory:"

jobs:
  test-matrix:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install -r requirements-api.txt
          pip install pytest pytest-cov pytest-xdist

      - name: Lint with flake8
        run: |
          pip install flake8
          # Stop the build if there are Python syntax errors or undefined names
          flake8 api/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 api/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Type check with mypy
        run: |
          pip install mypy
          mypy api/ --ignore-missing-imports --no-error-summary 2>/dev/null || true

      - name: Run unit tests (parallel)
        run: |
          pytest tests/test_security_units.py tests/test_payments_units.py -n auto --dist loadscope -v --tb=short

      - name: Run integration tests (parallel)
        run: |
          pytest tests/test_webhooks.py tests/test_payments_integration_simple.py -n auto --dist loadscope -v --tb=short

      - name: Run all tests with coverage (parallel)
        run: |
          pytest tests/ \
            -n auto --dist loadscope \
            --cov=api \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            -v --tb=short

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-py${{ matrix.python-version }}
          fail_ci_if_error: true

      - name: Generate test report
        if: always()
        run: |
          echo "## Test Results - Python ${{ matrix.python-version }}" >> $GITHUB_STEP_SUMMARY
          pytest tests/ -v --tb=line 2>&1 | tail -20 >> $GITHUB_STEP_SUMMARY || true

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    needs: test-matrix

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install gitleaks bandit

      - name: Run gitleaks (secret detection)
        run: |
          # Install gitleaks if not available via pip
          which gitleaks || {
            curl https://github.com/gitleaks/gitleaks/releases/download/v12.0.0/gitleaks-linux-x64 -L -o gitleaks
            chmod +x gitleaks
            ./gitleaks detect --source=github --verbose || true
          }

      - name: Run bandit (SAST)
        run: |
          bandit -r api/ -ll --json -o bandit-report.json || true
          cat bandit-report.json

      - name: Run safety (dependency check)
        run: |
          pip install safety
          safety check --json || true

  quality-gates:
    name: Code Quality Gates
    runs-on: ubuntu-latest
    needs: test-matrix

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pylint pytest-pylint

      - name: Run pylint
        run: |
          pylint api/ --exit-zero --output-format=colorized

      - name: Check code formatting with black
        run: |
          pip install black
          black --check api/ tests/ || true

      - name: Check import sorting with isort
        run: |
          pip install isort
          isort --check-only api/ tests/ || true

  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    if: always()
    needs: [test-matrix, security-scan, quality-gates]

    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.test-matrix.result }}" == "failure" ] || \
             [ "${{ needs.security-scan.result }}" == "failure" ] || \
             [ "${{ needs.quality-gates.result }}" == "failure" ]; then
            echo "❌ Build failed"
            exit 1
          else
            echo "✅ Build successful"
          fi

      - name: Post to GitHub summary
        run: |
          echo "## ✅ CI Pipeline Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Test Matrix**: ${{ needs.test-matrix.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Security Scan**: ${{ needs.security-scan.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Quality Gates**: ${{ needs.quality-gates.result }}" >> $GITHUB_STEP_SUMMARY
